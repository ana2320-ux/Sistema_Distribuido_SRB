# Espacio de nombres y configuración común del SRB.
# Todos los contenedores usan la imagen python:3.12-slim con la carpeta del proyecto (NFS) montada
# en /app y las librerias en k8s/libs (las instala scripts/k8s.sh). Las variables de entorno
# tienen prioridad sobre el .env de la carpeta, porque load_dotenv no sobreescribe las que existen.
apiVersion: v1
kind: Namespace
metadata:
  name: srb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srb-config
  namespace: srb
data:
  PYTHONPATH: /app/k8s/libs
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  GT_PUERTO_CLIENTES: "5555"
  GT_PUERTO_RMC: "5556"
  GT_PUERTO_CANCELACION: "5557"
  SP_PUERTO: "5558"
  SP_PUERTO_LECTURA: "5559"
  PUERTO_BASE_NOTIFICACIONES: "6000"
  TIMEOUT_MS: "5000"
  # Disco local del nodo de almacenamiento (hostPath), no la carpeta NFS.
  BD_RUTA: /var/tmp/srb/srb.db
  # Nombre DNS del Service de persistencia: sirve para los puertos 5558 y 5559.
  HOST_CAPA_PERSISTENCIA: persistencia
  # HOST_CAPA_SERVICIOS y HOST_CAPA_CONSUMIDORES los fija cada Deployment (cambian según el proceso).
