# Capa de almacenamiento (nodo capa=almacenamiento). Una sola réplica: SQLite admite un único
# proceso escritor. El pod trae dos contenedores sobre la misma base (modo WAL): el principal
# escribe y la réplica de lectura solo consulta.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistencia
  namespace: srb
spec:
  replicas: 1
  strategy:
    type: Recreate        # nunca dos pods sobre la misma base a la vez
  selector:
    matchLabels: {app: persistencia}
  template:
    metadata:
      labels: {app: persistencia}
    spec:
      nodeSelector:
        capa: almacenamiento
      volumes:
        - name: datos
          hostPath:
            path: /var/tmp/srb
            type: DirectoryOrCreate
      containers:
        - name: principal
          image: srb:2
          imagePullPolicy: Never
          command: ["python", "-m", "capa_persistencia.main"]
          envFrom: [{configMapRef: {name: srb-config}}]
          ports: [{containerPort: 5558}]
          volumeMounts: [{name: datos, mountPath: /var/tmp/srb}]
          livenessProbe:
            tcpSocket: {port: 5558}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: 5558}
            periodSeconds: 5
        - name: lectura
          image: srb:2
          imagePullPolicy: Never
          command: ["python", "-m", "capa_persistencia.main", "lectura"]
          envFrom: [{configMapRef: {name: srb-config}}]
          ports: [{containerPort: 5559}]
          volumeMounts: [{name: datos, mountPath: /var/tmp/srb}]
          livenessProbe:
            tcpSocket: {port: 5559}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: 5559}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: persistencia
  namespace: srb
spec:
  selector: {app: persistencia}
  ports:
    - {name: principal, port: 5558, targetPort: 5558}
    - {name: lectura, port: 5559, targetPort: 5559}
