# Capa de negocio (nodo capa=negocio).

# Gestor de Transacciones: un pod con dos contenedores iguales. Comparten la red del pod, así que
# el segundo encuentra los puertos ocupados y queda en espera; cuando el activo cae toma el
# control, y el kubelet reinicia el caído, que pasa a ser el respaldo.
# Probes: ambos contenedores sondean el puerto 5555, que el pod mantiene abierto mientras haya un
# gestor activo (el respaldo ve el mismo puerto porque comparten red).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gt
  namespace: srb
spec:
  replicas: 1
  selector:
    matchLabels: {app: gt}
  template:
    metadata:
      labels: {app: gt}
    spec:
      nodeSelector:
        capa: negocio
      volumes:
        - name: codigo     # la carpeta del proyecto (NFS): codigo y librerias en k8s/libs
          hostPath:
            path: /opt/Clusterv2/Sistema_Distribuido_SRB
            type: Directory
      containers:
        - name: activo
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "capa_negocios.main", "gt"]
          envFrom: [{configMapRef: {name: srb-config}}]
          env:
            - {name: HOST_CAPA_SERVICIOS, value: cancelaciones}   # el gestor la usa solo para llegar a Cancelaciones
          ports: [{containerPort: 5555}, {containerPort: 5556}]
          volumeMounts: [{name: codigo, mountPath: /app}]
          livenessProbe:
            tcpSocket: {port: 5555}
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: 5555}
            periodSeconds: 5
        - name: respaldo
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "capa_negocios.main", "gt"]
          envFrom: [{configMapRef: {name: srb-config}}]
          env:
            - {name: HOST_CAPA_SERVICIOS, value: cancelaciones}
          volumeMounts: [{name: codigo, mountPath: /app}]
          livenessProbe:
            tcpSocket: {port: 5555}
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: 5555}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gt
  namespace: srb
spec:
  selector: {app: gt}
  ports:
    - {name: clientes, port: 5555, targetPort: 5555}
    - {name: rmc, port: 5556, targetPort: 5556}
---
# RMC: 3 réplicas. Se conectan al gestor (nombre DNS gt) y consultan en la réplica de lectura.
# No abren puerto, así que no llevan probe de red: si el proceso muere, se reinicia el contenedor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmc
  namespace: srb
spec:
  replicas: 3
  selector:
    matchLabels: {app: rmc}
  template:
    metadata:
      labels: {app: rmc}
    spec:
      nodeSelector:
        capa: negocio
      volumes:
        - name: codigo     # la carpeta del proyecto (NFS): codigo y librerias en k8s/libs
          hostPath:
            path: /opt/Clusterv2/Sistema_Distribuido_SRB
            type: Directory
      containers:
        - name: rmc
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "capa_negocios.main", "rmc", "--con-replica"]
          envFrom: [{configMapRef: {name: srb-config}}]
          volumeMounts: [{name: codigo, mountPath: /app}]
          env:
            - {name: HOST_CAPA_SERVICIOS, value: gt}
---
# Servicio de Cancelaciones: una réplica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cancelaciones
  namespace: srb
spec:
  replicas: 1
  selector:
    matchLabels: {app: cancelaciones}
  template:
    metadata:
      labels: {app: cancelaciones}
    spec:
      nodeSelector:
        capa: negocio
      volumes:
        - name: codigo     # la carpeta del proyecto (NFS): codigo y librerias en k8s/libs
          hostPath:
            path: /opt/Clusterv2/Sistema_Distribuido_SRB
            type: Directory
      containers:
        - name: cancelaciones
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "capa_negocios.main", "cancelaciones"]
          envFrom: [{configMapRef: {name: srb-config}}]
          volumeMounts: [{name: codigo, mountPath: /app}]
          env:
            - {name: HOST_CAPA_SERVICIOS, value: gt}
          ports: [{containerPort: 5557}]
          livenessProbe:
            tcpSocket: {port: 5557}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: 5557}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cancelaciones
  namespace: srb
spec:
  selector: {app: cancelaciones}
  ports:
    - {name: cancelaciones, port: 5557, targetPort: 5557}
